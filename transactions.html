<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#E31E24">
    <title>Kasmate — Kas kelas, lebih tertata</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="index.html">
                <img class="brand-image" src="./assets/kasmate-logo.png" alt="Logo Kasmate">Kasmate</a>
            <button class="mobile-menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
            <nav class="nav" id="nav">
                <a data-page="home" href="index.html">Home</a>
                <a data-page="about" href="about.html">About</a>
                <a data-page="dashboard" href="dashboard.html">Dashboard</a>
                <a data-page="transactions" href="transactions.html">Transaksi</a>
                <a data-page="settings" href="settings.html">Settings</a>
                <button class="nav-cta" id="accountBtn" onclick="accountAction()">Masuk</button>
            </nav>
        </header>
        <main>
            <section class="page active" id="transactions">
                <div class="panel-wrap">
                    <div class="panel-head">
                        <div>
                            <h1 data-t="transactionHistory">Riwayat transaksi</h1>
                            <p data-t="transactionHistoryDesc">Catatan transaksi kas dari database bersama.</p>
                        </div>
                    </div>
                    <div class="panel history-card">
                        <div id="transactionHistoryFullList" class="history-list">
                        </div>
                    </div>
                    <div class="panel history-card">
                        <div class="panel-head">
                            <div>
                                <h2 data-t="expenseHistory">Riwayat pengeluaran</h2>
                                <p data-t="expenseHistoryDesc">Catatan pengeluaran dari kas kelas.</p>
                            </div>
                        </div>
                        <div id="expenseHistoryFullList" class="history-list">
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="footer">
            <a class="brand" href="index.html">
                <img class="brand-image" src="./assets/kasmate-logo.png" alt="Logo Kasmate">Kasmate</a>
            <span>© 2026 Kasmate · Urusan kas kelas jadi lebih mudah.</span>
        </footer>
    </div>
    <div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <h2>Daftarkan kelas</h2>
            <p>Buat ruang baru untuk mengelola kas kelas.</p>
            <div class="field">
                <label>Nama kelas</label>
                <input id="newClassName" placeholder="Contoh: XI PPLG 2">
            </div>
            <div class="field">
                <label>Nama sekolah</label>
                <input id="newSchool" placeholder="Contoh: SMK Telkom Bandung">
            </div>
            <div class="field">
                <label>Tahun ajaran</label>
                <select id="newYear">
                    <option>2026/2027</option>
                    <option>2025/2026</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModal()">Batal</button>
                <button class="primary" onclick="addClass()">Buat kelas</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast">
    </div>
    <script src="./js/app.js">
    </script>
</body>

</html>
